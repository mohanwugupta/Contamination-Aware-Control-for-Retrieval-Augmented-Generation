# RAMDocs -- Vanilla RAG (dense-only, no reranking)
# Baseline A on the mixed-conflict stress-test benchmark.
# RAMDocs bundles documents per example as the retrieval corpus.

# --- dataset ---
dataset: ramdocs
split: test

# --- retrieval ---
retriever_type: dense
reranker_enabled: false
top_k_retrieval: 10
top_k_after_rerank: 10
context_strategy: full
dense_model: BAAI/bge-base-en-v1.5

# --- generation ---
generator_model: Qwen/Qwen2.5-32B-Instruct
prompt_family: multi_answer
answer_mode: multi
vllm_base_url: http://localhost:8000/v1

# --- output ---
output_dir: outputs/ramdocs_vanilla_rag
random_seed: 42