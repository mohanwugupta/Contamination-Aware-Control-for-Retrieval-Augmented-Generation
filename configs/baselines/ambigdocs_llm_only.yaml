# AmbigDocs -- LLM-Only (no retrieval)
# Control run for same-name entity disambiguation benchmark.
# Dataset bundles its own documents; retriever is not used here.

# --- dataset ---
dataset: ambigdocs
split: validation

# --- retrieval ---
retriever_type: none
reranker_enabled: false
top_k_retrieval: 0
top_k_after_rerank: 0
context_strategy: none

# --- generation ---
generator_model: Qwen/Qwen2.5-32B-Instruct
prompt_family: multi_answer
answer_mode: multi
vllm_base_url: http://localhost:8000/v1

# --- output ---
output_dir: outputs/ambigdocs_llm_only
random_seed: 42