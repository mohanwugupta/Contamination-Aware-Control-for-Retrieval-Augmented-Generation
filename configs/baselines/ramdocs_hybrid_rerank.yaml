# RAMDocs -- Hybrid RAG + Reranker (main strong baseline)
# Baseline C on the mixed-conflict stress-test benchmark.
# Cross-encoder reranking applied after hybrid retrieval.

# --- dataset ---
dataset: ramdocs
split: test

# --- retrieval ---
retriever_type: hybrid
reranker_enabled: true
top_k_retrieval: 10
top_k_after_rerank: 5
context_strategy: full
dense_model: BAAI/bge-base-en-v1.5
reranker_model: BAAI/bge-reranker-v2-m3

# --- generation ---
generator_model: Qwen/Qwen2.5-32B-Instruct
prompt_family: multi_answer
answer_mode: multi
vllm_base_url: http://localhost:8000/v1

# --- output ---
output_dir: outputs/ramdocs_hybrid_rerank
random_seed: 42