# Baseline 0 -- LLM-Only Control
# No retrieval, no reranking -- pure parametric knowledge baseline.
# Used to measure how much retrieval helps or hurts on each dataset.

# --- dataset ---
dataset: nq_open
split: validation

# --- retrieval ---
retriever_type: none
reranker_enabled: false
top_k_retrieval: 0
top_k_after_rerank: 0
context_strategy: none

# --- generation ---
generator_model: Qwen/Qwen2.5-32B-Instruct
prompt_family: single_answer
answer_mode: single
vllm_base_url: http://localhost:8000/v1

# --- output ---
output_dir: outputs/llm_only
random_seed: 42